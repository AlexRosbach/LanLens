name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: semgrep scan --config p/default --severity ERROR --error backend frontend/src mcp/src
  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: lanlens-ci:local
          - dockerfile: mcp/Dockerfile
            image: lanlens-mcp-ci:local
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}" .
      - name: Verify LanLens runtime without build-time package managers
        if: matrix.dockerfile == 'Dockerfile'
        run: |
          docker run --rm --network none \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -e DB_PATH=/tmp/lanlens-smoke.db --entrypoint python "${{ matrix.image }}" \
            -c 'import importlib.util; from backend.main import app; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("ensurepip") is None; assert app.title == "LanLens"'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
