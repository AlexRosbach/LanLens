name: PR validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev nmap gcc
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Test backend
        env:
          DB_PATH: /tmp/lanlens-ci.db
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -m pytest -q backend/tests
      - run: bash -n backend/assets/linux_agent/install.sh
      - run: python -m py_compile backend/assets/linux_agent/lanlens-agent.py
  frontend-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mcp/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npm test
        working-directory: mcp
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Compile Windows agent with the installer compiler
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $sourceFile = (Resolve-Path 'backend/assets/windows_agent/LanLensAgent.cs').Path
          & $compiler /nologo /target:exe /out:"$env:RUNNER_TEMP\LanLensAgent.exe" /r:System.ServiceProcess.dll /r:System.Management.dll /r:System.Web.Extensions.dll /r:System.Net.Http.dll $sourceFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path backend/assets/windows_agent/install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors; exit 1 }

  security:
    uses: ./.github/workflows/security.yml

  docker:
    name: Docker build, smoke test and scan
    needs: [backend, frontend-and-mcp, windows-agent, security]
    uses: ./.github/workflows/docker-build.yml

  publication-policy:
    name: Docker publication policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - name: Explain publishing eligibility
        id: policy
        env:
          REPOSITORY_OK: ${{ github.repository == 'AlexRosbach/LanLens' }}
          EVENT_OK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          PUBLISH_ENABLED: ${{ vars.DOCKERHUB_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          printf 'Repository eligible: %s\nEvent eligible: %s\n' "$REPOSITORY_OK" "$EVENT_OK"
          if [[ "$REPOSITORY_OK" != true || "$EVENT_OK" != true ]]; then
            echo 'Publication not allowed for this repository/event.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$PUBLISH_ENABLED" in
            true)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              echo 'Publication enabled for eligible event.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            false)
              echo 'Publication explicitly disabled by repository variable.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::Set DOCKERHUB_PUBLISH_ENABLED to true or false under repository Settings > Secrets and variables > Actions > Variables (not Environment or Secret).'
              echo 'Missing or invalid repository publishing variable. No Docker Hub credentials accessed.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  publish:
    name: Publish verified Docker images
    needs: [docker, publication-policy]
    if: needs.publication-policy.outputs.enabled == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.docker.outputs.version }}
